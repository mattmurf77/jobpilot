<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobPilot</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">✈️ <span>JobPilot</span></div>
  <nav class="tabs">
    <button class="tab active" data-tab="find">Find Jobs</button>
    <button class="tab" data-tab="review">Tailor &amp; Review</button>
    <button class="tab" data-tab="pipeline">Pipeline</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>
  <div class="health" id="health-indicator" title="Backend status">●</div>
</header>

<main>
  <!-- Each tab panel is owned by its matching js/ module. -->
  <section id="tab-find" class="tab-panel active"></section>
  <section id="tab-review" class="tab-panel"></section>
  <section id="tab-pipeline" class="tab-panel"></section>
  <section id="tab-settings" class="tab-panel"></section>
</main>

<div id="toast-container"></div>

<script src="js/app.js"></script>
<script src="js/find.js"></script>
<script src="js/review.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
